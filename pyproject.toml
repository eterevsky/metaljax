[project]
name = "metaljax"
version = "0.0.1"
description = "A Metal backend for JAX: PJRT plugin + StableHLO interpreter executing on MLX"
requires-python = ">=3.11"
dependencies = ["mlx>=0.32", "numpy", "ml_dtypes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points.jax_plugins]
metal = "jax_plugins.metal"

[tool.hatch.build.targets.wheel]
packages = ["src/metaljax", "src/jax_plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
